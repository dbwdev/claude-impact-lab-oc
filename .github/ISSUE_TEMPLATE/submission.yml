name: Team submission
description: Submit your team's project. One per team, due 4:30 PM.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        One submission per team. You can edit this after you post it, up to 4:30 PM.
  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: Team members
      description: Names, one per line.
    validations:
      required: true
  - type: dropdown
    id: challenge
    attributes:
      label: Challenge
      options:
        - 1 Referral intake
        - 2 Finding the right resource
        - 3 Staff AI confidence
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository link
      description: Must be public.
      placeholder: https://github.com/your-name/your-repo
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Demo video link
      description: Two minutes of the thing working. Optional, and it helps the judges.
  - type: textarea
    id: summary
    attributes:
      label: What you built
      description: Who it is for and what it does, in three or four sentences.
    validations:
      required: true
  - type: textarea
    id: honest
    attributes:
      label: What is real, what is mocked, and where it gets things wrong
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Who should Illumination Health + Home contact about this project?
      description: A name and an email address. This issue is public; use an address you are comfortable sharing, or write "ask the organizers".
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: The repo is public and has an open-source license.
          required: true
        - label: The project uses only synthetic or public data. There is no real patient or client information in the repo or its history.
          required: true
        - label: There are no API keys or passwords in the repo or its history.
          required: true
        - label: We agree that Illumination Health + Home may use, change and build on this work.
          required: true
