[project]
name = "intake"
version = "0.1.0"
description = "Referral packet pipeline for IHH recuperative care intake (Claude Impact Lab prototype)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "typesafe-sdk",
    "pypdfium2>=4.30",
    "pillow>=10",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.scripts]
intake = "intake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]
